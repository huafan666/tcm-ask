<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中医辨证助手 · 开发端（插件画布）</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-text">中医辨证助手</span>
    <span class="brand-sub">开发端 · 插件画布</span>
  </div>

  <div class="topstats" id="topstats"></div>

  <div class="topactions">
    <button class="btn" id="btn-reload" title="丢弃未保存的改动，从磁盘重新读取插件">重新载入</button>
    <button class="btn" id="btn-new" title="新建一个症状/脉象/证候/方剂节点">＋ 新建节点</button>
    <button class="btn btn-ghost" id="btn-layout-all" title="按 症状→证候→方剂 分层重新自动布局">自动布局</button>
    <button class="btn btn-primary" id="btn-save" title="预览 diff 后写回 plugins/*.js（Ctrl+S）">
      保存 <span class="badge" id="dirty-count">0</span>
    </button>
    <span class="pill pill-wait" id="main-status">主服务检测中…</span>
  </div>
</header>

<!-- ============ 主体三栏 ============ -->
<main class="workspace">

  <!-- 左：节点清单 -->
  <aside class="sidebar sidebar-left">
    <div class="panel-head">
      <span>节点清单</span>
      <span class="panel-head-hint" id="list-count"></span>
    </div>
    <div class="panel-body">
      <input class="input" id="search" placeholder="搜索中文名 / name / 触发词…">
      <div class="segmented" id="kind-filters"></div>
      <div class="segmented segmented-sm" id="flag-filters">
        <button class="seg" data-flag="orphan">未被引用</button>
        <button class="seg" data-flag="or">多路径OR</button>
        <button class="seg" data-flag="dirty">已改动</button>
      </div>
      <div class="node-list" id="node-list"></div>
    </div>
  </aside>

  <!-- 中：画布 -->
  <section class="canvas-wrap">
    <div class="canvas-toolbar">
      <button class="tbtn" id="btn-zoom-out" title="缩小">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="tbtn" id="btn-zoom-in" title="放大">＋</button>
      <button class="tbtn" id="btn-fit" title="适应全部（F）">适应</button>
      <span class="tb-sep"></span>
      <label class="tcheck"><input type="checkbox" id="chk-focus"> 聚焦模式</label>
      <label class="tcheck"><span>跳数</span><input type="number" id="focus-depth" value="2" min="1" max="6" class="num"></label>
      <span class="tb-sep"></span>
      <label class="tcheck"><input type="checkbox" id="chk-sim" checked> 模拟着色</label>
      <label class="tcheck"><input type="checkbox" id="chk-edges" checked> 显示连线</label>
      <label class="tcheck"><input type="checkbox" id="chk-arrows" checked> 箭头方向</label>
      <span class="tb-sep"></span>
      <label class="tcheck"><input type="checkbox" id="chk-only-issues"> 只看有问题的</label>
    </div>

    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,.045)" stroke-width="1"/>
        </pattern>
        <marker id="arrow-yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
        </marker>
        <marker id="arrow-no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
        </marker>
        <marker id="arrow-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
        </marker>
      </defs>
      <g id="layer-grid"><rect id="grid-rect" x="-5000" y="-5000" width="20000" height="20000" fill="url(#grid)"/></g>
      <g id="layer-edges"></g>
      <g id="layer-nodes"></g>
      <g id="layer-overlay"></g>
      <rect id="marquee" class="marquee" x="0" y="0" width="0" height="0" visibility="hidden"></rect>
    </svg>

    <div class="minimap" id="minimap">
      <svg id="minimap-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="minimap-view" id="minimap-view"></div>
    </div>

    <div class="canvas-hint" id="canvas-hint">
      <b>操作：</b>拖空白＝框选 · 拖节点＝移动（可多选）· 滚轮＝缩放 · <kbd>空格</kbd>/中键拖＝平移
      · 从节点<b>右侧圆点</b>拖到目标节点＝新增依赖条件（默认 是；按 <kbd>Alt</kbd> 落下＝否）
      · 点连线＝选中 · <kbd>Delete</kbd>＝删除所选 · <kbd>Ctrl+S</kbd>＝保存 · <kbd>Esc</kbd>＝取消
    </div>
  </section>

  <!-- 右：面板 -->
  <aside class="sidebar sidebar-right">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="inspect">检视器</button>
      <button class="tab" data-tab="sim">实时模拟</button>
      <button class="tab" data-tab="chain">条文反向</button>
      <button class="tab" data-tab="walk">问诊回放</button>
    </nav>
    <div class="tab-body" id="tab-inspect"></div>
    <div class="tab-body hidden" id="tab-sim"></div>
    <div class="tab-body hidden" id="tab-chain"></div>
    <div class="tab-body hidden" id="tab-walk"></div>
  </aside>
</main>

<!-- ============ 状态栏 ============ -->
<footer class="statusbar">
  <span id="status-left">就绪</span>
  <span class="status-spacer"></span>
  <span id="status-sel"></span>
  <span id="status-zoom"></span>
</footer>

<!-- ============ 弹窗 / 提示 ============ -->
<div class="modal-host hidden" id="modal-host">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast-host" id="toast-host"></div>
<div class="ctxmenu hidden" id="ctxmenu"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
